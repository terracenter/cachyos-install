# Picom FT-Labs Config - Omarchy Style

animations = true;
animation-stiffness = 200.0;
animation-dampening = 20.0;
animation-clamping = true;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "fly-in";
animation-for-workspace-switch-out = "fly-out";

corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
  "name = 'Notification'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

inactive-opacity = 0.95;
active-opacity = 1.0;
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Rofi'"
];

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'slop'",
  "class_g = 'maim'"
];

backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";
