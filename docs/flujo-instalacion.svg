          .node.focal { stroke: #0284c7; fill: rgba(2,132,199,.07); }
          .node.risk { stroke: #e7000b; fill: rgba(231,0,11,.07); }
          .node.ok { stroke: #059669; fill: rgba(5,150,105,.08); }
          .kicker { font: 600 9px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; fill: #5a5444; }
          .title { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2226; }
