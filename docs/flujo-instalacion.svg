        <text x="26" y="66" font-size="24" font-weight="600" letter-spacing="-0.4" fill="#1d2226">install.sh: del menú a un sistema instalado</text>

        <g><rect class="node" x="26" y="104" width="908" height="76" rx="6"/><text class="kicker" x="40" y="126">ENTRADA</text><text class="title" x="40" y="150">install.sh · CachyOS Installation Suite</text><text class="sub" x="40" y="168">Live USB: sudo ./install.sh · Sistema instalado: ./install.sh · menú whiptail</text></g>

        <g><rect class="node risk" x="26" y="210" width="212" height="88" rx="6"/><text class="kicker" x="40" y="233">OPCIÓN 1 · LIVE USB</text><text class="title" x="40" y="258">Instalación base</text><text class="sub" x="40" y="276">base/install-base.sh</text><text class="sub" x="40" y="289">formatea el disco · pide sudo</text></g>
        <g><rect class="node focal" x="258" y="210" width="212" height="88" rx="6"/><text class="kicker" x="272" y="233">OPCIÓN 2</text><text class="title" x="272" y="258">Hyprland (Wayland)</text><text class="sub" x="272" y="276">submenú de 3 acciones</text><text class="sub" x="272" y="289">hyprland/</text></g>
        <g><rect class="node focal" x="490" y="210" width="212" height="88" rx="6"/><text class="kicker" x="504" y="233">OPCIÓN 3</text><text class="title" x="504" y="258">Qtile (X11)</text><text class="sub" x="504" y="276">submenú de 2 acciones</text><text class="sub" x="504" y="289">qtile/</text></g>
        <g><rect class="node" x="722" y="210" width="212" height="88" rx="6"/><text class="kicker" x="736" y="233">OPCIÓN 4</text><text class="title" x="736" y="258">Apps genéricas</text><text class="sub" x="736" y="276">suite del menú principal</text><text class="sub" x="736" y="289">sin submenú</text></g>

        <g><rect class="node focal" x="26" y="326" width="212" height="178" rx="6"/><text class="kicker" x="40" y="348">install-base.sh · ETAPAS</text><text class="step" x="40" y="372">1  Preguntas y confirmación</text><text class="step" x="40" y="396">2  Partición (LUKS opcional)</text><text class="step" x="40" y="420">3  BTRFS + subvolúmenes</text><text class="step" x="40" y="444">4  pacstrap + fstab</text><text class="step" x="40" y="468">5  GRUB + grub-btrfs</text><text class="step" x="40" y="492">6  Snapper + usuario</text></g>
        <g><rect class="node ok" x="26" y="516" width="212" height="84" rx="6"/><text class="kicker" x="40" y="538">FINAL</text><text class="title" x="40" y="562">Snapshot inicial</text><text class="sub" x="40" y="580">sistema-base-instalado</text><text class="sub" x="40" y="593">retira el USB y reinicia</text></g>

        <g><rect class="node focal" x="258" y="326" width="212" height="84" rx="6"/><text class="kicker" x="272" y="348">2.1 · INSTALAR BASE</text><text class="title" x="272" y="372">Escritorio Hyprland</text><text class="sub" x="272" y="390">install-hyprland-desktop.sh</text><text class="sub" x="272" y="403">basico + configuracion</text></g>
        <g><rect class="node focal" x="258" y="421" width="212" height="84" rx="6"/><text class="kicker" x="272" y="443">2.2 · APPS</text><text class="title" x="272" y="467">Apps y gaming</text><text class="sub" x="272" y="485">install-hyprland-apps.sh</text><text class="sub" x="272" y="498">install/apps/*</text></g>
        <g><rect class="node risk" x="258" y="516" width="212" height="84" rx="6"/><text class="kicker" x="272" y="538">2.3 · DESINSTALAR</text><text class="title" x="272" y="562">Limpieza completa</text><text class="sub" x="272" y="580">uninstall-hyprland-omarchy.sh</text></g>

        <g><rect class="node focal" x="490" y="326" width="212" height="84" rx="6"/><text class="kicker" x="504" y="348">3.1 · INSTALAR</text><text class="title" x="504" y="372">Escritorio Qtile</text><text class="sub" x="504" y="390">install-qtile-omarchy.sh</text><text class="sub" x="504" y="403">X11 + modesetting Intel DRI3</text></g>
        <g><rect class="node risk" x="490" y="421" width="212" height="84" rx="6"/><text class="kicker" x="504" y="443">3.2 · DESINSTALAR</text><text class="title" x="504" y="467">Limpieza completa X11</text><text class="sub" x="504" y="485">uninstall-qtile-omarchy.sh</text></g>

        <g><rect class="node" x="722" y="326" width="212" height="84" rx="6"/><text class="kicker" x="736" y="348">SCRIPT</text><text class="title" x="736" y="372">QEMU y ofimática</text><text class="sub" x="736" y="390">apps/install-apps.sh</text></g>

        <g><rect class="node note" x="490" y="516" width="444" height="84" rx="6"/><text class="kicker" x="504" y="538">NAVEGACIÓN</text><text class="title" x="504" y="562">Volver y salir</text><text class="sub" x="504" y="580">Los submenús 2 y 3 terminan en «Volver al menú principal».</text><text class="sub" x="504" y="593">La opción 5 del menú principal cierra el instalador.</text></g>

