          .sub { font: 400 9.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #5a5444; }
          .connector { stroke: #5a5444; stroke-width: 1.5; fill: none; }
          .connector.ok { stroke: #059669; }
        </style>
