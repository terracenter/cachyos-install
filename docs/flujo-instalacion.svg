<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cf-flow-title cf-flow-desc" id="flujo-instalacion-root">
        <title id="cf-flow-title">install.sh: del menú a un sistema instalado</title>
        <desc id="cf-flow-desc">El punto de entrada install.sh abre un menú whiptail con cinco opciones. La opción 1 ejecuta base/install-base.sh, que formatea el disco, crea BTRFS con subvolúmenes, instala el sistema con pacstrap, configura GRUB con grub-btrfs, Snapper y el usuario, toma un snapshot inicial y pide reiniciar. La opción 2 abre un submenú de Hyprland con tres acciones: instalar el escritorio, instalar apps y gaming, o desinstalar. La opción 3 abre un submenú de Qtile con instalar y desinstalar. La opción 4 ejecuta la suite de aplicaciones genéricas. La opción 5 sale.</desc>
